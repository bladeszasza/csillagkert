<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Csillagkert – feladat-galéria</title>
<link rel="stylesheet" href="../style.css">
<style>
  /* Áttekintő a generált feladatokról: sablononként és szintenként egy minta, kicsinyítve. A helyes válasz zöld keretet kap.
     Nem játszik hangot és nem ír a mentésbe. Használat: tests/gallery.html?st=forma (állomás azonosítója) */
  html, body { height: auto !important; overflow: visible !important; position: static !important; }
  body { touch-action: auto; font-family: system-ui; background: #fff; padding: 12px; }
  #g { display: grid; grid-template-columns: repeat(auto-fill, 420px); gap: 14px; }
  .gcard { width: 420px; border: 2px solid #ddd; border-radius: 14px; overflow: hidden; background: #f3ecff; }
  .gin { zoom: 0.41; width: 1024px; height: 600px; display: flex; justify-content: center; padding-top: 20px; }
  .gcard p { margin: 0; padding: 4px 8px; font-size: 13px; background: #fff; }
  .answer.ok-mark { outline: 8px solid #2fa84f; outline-offset: 4px; }
</style>
</head>
<body>
<h1 id="h">Feladat-galéria</h1>
<div id="g"></div>
<script type="module">
  import { TEMPLATES, targetsOf, build } from '../js/content/engine.js';
  import { rng } from '../js/content/rng.js';
  import { shapeSvg, decoSvg, tapPoint, KEPEK } from '../js/content/kepek.js';
  function kepHtml(it) {
    const body = it.parts.map(p => `<g>${p.shapes.map(s => shapeSvg(s, `fill="${p.id === it.target ? it.colors[it.color - 1] : '#fff'}" stroke="#3b2a63" stroke-width="3" stroke-linejoin="round"`)).join('')}</g>`).join('')
      + it.deco.map(decoSvg).join('') + it.parts.map(p => { const [x, y] = tapPoint(it.pic, p.id); return `<circle cx="${x}" cy="${y}" r="2.5" fill="#ff2d6f"/>`; }).join('');
    return `<div class="activity kep"><div class="prompt">${it.say}</div><svg viewBox="0 0 200 200" style="width:430px;height:430px;background:#fff;border-radius:22px">${body}</svg><div class="prompt" style="font-size:20px">${it.cnames.join(', ')}</div></div>`;
  }
  function matricaHtml(it) {
    const u = 4.6, ok = it.slots.find(s => s.ok), at = ok.rel === 'bele' ? [ok.x, 62 - it.refs[ok.ref].s * 0.88] : [ok.x, ok.y];
    return `<div class="activity matrica"><div class="prompt">${it.say}</div><div class="mt-scene" style="--u:${u}px;width:${120 * u}px;height:${100 * u}px"><div class="mt-ground"></div><div class="mt-shelf"></div>`
      + it.refs.map(r => `<span class="mt-ref" style="left:${r.x * u}px;top:${62 * u}px;font-size:${r.s * u}px">${r.pic}</span>`).join('')
      + it.slots.map(s => `<div class="mt-slot" style="left:${s.x * u}px;top:${s.y * u}px;${s.ok ? 'border-color:#2fa84f;background:rgba(47,168,79,.4)' : ''}"></div>`).join('')
      + `<span class="mt-st${ok.rel === 'bele' ? ' behind' : ''}" style="left:${at[0] * u}px;top:${at[1] * u}px">${it.sticker[0]}</span></div></div>`;
  }
  import { markup } from '../js/activities/pick.js';
  import { NOTES } from '../js/notes.js';
  import { boardHtml, chipsHtml } from '../js/content/algo.js';
  import { solve as robotSolve, compress, DIRS } from '../js/robot-path.js';
  import { compose, GLYPHS, LETTERS, DIGITS } from '../js/glyphs.js';
  import { decode, solveMaze } from '../js/maze-core.js';
  // Ceruzavár: a vonások SVG-ben, a kezdőpont száma és a vonás iránya (nyílhegy) látszik; a szülő így átnézheti a betűformákat
  function strokesSvg(strokes, size = 360) {
    const all = strokes.flat(), xs = all.map(p => p[0]), ys = all.map(p => p[1]);
    const x0 = Math.min(...xs) - 0.4, y0 = Math.min(...ys) - 0.4, w = Math.max(...xs) - x0 + 0.4, h = Math.max(...ys) - y0 + 0.4, u = Math.max(w, h) / 40;
    const lines = strokes.map((st, i) => st.length === 1
      ? `<circle cx="${st[0][0]}" cy="${st[0][1]}" r="${u * 1.4}" fill="#8e5be8"/>`
      : `<polyline points="${st.map(p => p.join(',')).join(' ')}" fill="none" stroke="#8e5be8" stroke-width="${u * 1.3}" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>`).join('');
    const badges = strokes.map((st, i) => `<circle cx="${st[0][0]}" cy="${st[0][1]}" r="${u * 2.2}" fill="${i ? '#d9c8fb' : '#4cc38a'}"/><text x="${st[0][0]}" y="${st[0][1] + u * 0.9}" font-size="${u * 2.6}" text-anchor="middle" font-weight="800" fill="${i ? '#3b2a63' : '#fff'}">${i + 1}</text>`).reverse().join('');
    return `<svg viewBox="${x0} ${y0} ${w} ${h}" width="${size}" height="${size * Math.min(1.4, h / w)}" style="background:#fff;border-radius:12px"><defs><marker id="ah" markerWidth="4" markerHeight="4" refX="2" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 z" fill="#e69a00"/></marker></defs>${lines}${badges}</svg>`;
  }
  function mazeSvg(it) {
    const c = decode(it.rows), sol = solveMaze(it.rows, it.start, it.goal).path; let walls = '';
    for (let y = 0; y < it.h; y++) for (let x = 0; x < it.w; x++) { const v = c[y][x];
      if (!(v & 1)) walls += `M${x},${y}H${x + 1}`; if (!(v & 8)) walls += `M${x},${y}V${y + 1}`;
      if (x === it.w - 1 && !(v & 2)) walls += `M${x + 1},${y}V${y + 1}`; if (y === it.h - 1 && !(v & 4)) walls += `M${x},${y + 1}H${x + 1}`; }
    return `<svg viewBox="-0.2 -0.2 ${it.w + 0.4} ${it.h + 0.4}" width="420" style="background:#fff;border-radius:12px"><polyline points="${sol.map(([x, y]) => (x + 0.5) + ',' + (y + 0.5)).join(' ')}" fill="none" stroke="#ffd34d" stroke-width="0.3" stroke-linecap="round" stroke-linejoin="round"/><path d="${walls}" stroke="#6b4bb5" stroke-width="0.09" stroke-linecap="round"/><text x="0.5" y="0.7" font-size="0.5" text-anchor="middle">🐱</text><text x="${it.goal[0] + 0.5}" y="${it.goal[1] + 0.7}" font-size="0.5" text-anchor="middle">⭐</text></svg>`;
  }
  function dotsSvg(it) {
    const pts = it.dots, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), x0 = Math.min(...xs) - 1, y0 = Math.min(...ys) - 1, w = Math.max(...xs) - x0 + 1, h = Math.max(...ys) - y0 + 1;
    return `<svg viewBox="${x0} ${y0} ${w} ${h}" width="380" style="background:#fff;border-radius:12px"><polyline points="${[...pts, ...(it.closed ? [pts[0]] : [])].map(p => p.join(',')).join(' ')}" fill="#fff3c4" stroke="#c9b3f5" stroke-width="0.12" stroke-dasharray="0.3 0.2"/>${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="0.22" fill="${i ? '#6b4bb5' : '#4cc38a'}"/><text x="${p[0] + 0.3}" y="${p[1] - 0.25}" font-size="0.6" font-weight="800" fill="#3b2a63">${i + 1}</text>`).join('')}</svg>`;
  }
  const nm = n => NOTES[n].name;
  // a hallásos feladat hangsora szövegesen (a galéria nem játszik hangot): hangnév, (hangerő), [hossz], TÁ / ti taps, · csend
  const sndText = evs => evs.map(e => e.rest ? '·' : e.clap ? (e.dur >= 0.5 ? 'TÁ' : 'ti') : nm(e.n) + (e.vol !== undefined ? '(' + e.vol + ')' : '') + (e.dur !== undefined && e.dur !== 0.8 ? '[' + e.dur + ']' : '') + (e.hi ? '@' + e.hi : '')).join(' ');
  const st = new URLSearchParams(location.search).get('st') || 'szamol', onlySk = new URLSearchParams(location.search).get('sk');
  document.getElementById('h').textContent = `Feladat-galéria: ${st}`;
  const out = document.getElementById('g');
  for (const t of TEMPLATES.filter(t => t.station === st && (!onlySk || t.id === onlySk))) {
    const byLevel = new Map(); for (const x of targetsOf(t)) if (!byLevel.has(x.level)) byLevel.set(x.level, x);
    for (const x of byLevel.values()) {
      const it = build(x.id, rng(x.id + '#galeria'));
      const card = document.createElement('div'); card.className = 'gcard';
      const body = it.type === 'pick' ? markup(it, it.options)
        : it.type === 'memory' ? `<div class="activity"><div class="prompt">memória: ${it.deck.length} pár</div><div class="qbox" style="font-size:60px">${it.deck.map(c => `<span title="${c.n}">${c.e}</span>`).join(' ')}</div><div class="prompt">${it.deck.map(c => c.n).join(', ')}</div></div>`
        : it.type === 'echo' ? `<div class="activity music"><div class="prompt">visszhang: ${it.melody.map(nm).join(' – ')}</div><div class="answers"><span class="mbell">🎵</span></div><div class="answers bells">${it.bells.map(k => `<button class="answer key bell" style="background:${NOTES[k].c}"><span>🔔</span><small>${nm(k)}</small></button>`).join('')}</div></div>`
        : it.type === 'algo' ? `<div class="activity algo"><div class="prompt">${it.prefill?.length ? 'javítás' : 'építés'}${it.loops ? ' ismétléssel' : ''} · ${it.max} hely</div>${boardHtml(it, 64)}<div class="aprog">${(it.prefill || []).map(d => `<span class="atok">${DIRS[d][2]}</span>`).join('')}</div><div class="prompt">segítség: ${chipsHtml(compress(robotSolve(it), it.loops))}</div></div>`
        : it.type === 'trace' ? `<div class="activity"><div class="prompt">${it.prompt} · ${it.free ? 'bármelyik irány' : 'kötött irány'} · tűrés ${it.tol}</div>${strokesSvg(it.strokes, 520)}<div class="prompt" style="font-size:22px">${it.say}</div></div>`
        : it.type === 'maze' ? `<div class="activity"><div class="prompt">útvesztő ${it.w}×${it.h} · ${x.key}</div>${mazeSvg(it)}</div>`
        : it.type === 'dots' ? `<div class="activity"><div class="prompt">${it.dots.length} pötty → ${it.pic} ${it.name}</div>${dotsSvg(it)}</div>`
        : it.type === 'racs' ? `<div class="activity"><div class="prompt">${it.mode} · ${it.say}</div>${it.rules ? `<div>${it.rules.map(([s, c]) => `${s} → <span style="display:inline-block;width:22px;height:22px;border-radius:50%;background:${it.colors[c - 1]}"></span>`).join(' &nbsp; ')}</div>` : ''}<div style="display:flex;gap:18px;align-items:center">${it.grids.map((g, gi) => `<div style="display:grid;grid-template-columns:repeat(${g.w},34px);grid-auto-rows:34px;gap:2px;background:#c9b3f5;padding:2px;border-radius:8px">${[...g.fixed].map((c, i) => { const v = c === '?' ? (it.goal[gi]?.[i] ?? '0') : c, col = v === '0' ? '#fff' : it.colors[+v - 1]; const sh = g.shapes?.[i]; return `<div style="background:${sh ? '#fff' : col};${c === '?' ? 'outline:2px dashed #8e5be8;outline-offset:-4px;' : ''}${g.axis && i % g.w === g.axis ? 'border-left:4px solid #8e5be8;' : ''}display:flex;align-items:center;justify-content:center;font:800 ${sh && sh === sh.toUpperCase() ? 22 : 14}px system-ui;color:${sh ? col : '#000'}">${sh ? (v === '0' ? sh : '●' + sh) : ''}</div>`; }).join('')}</div>`).join('➜')}</div></div>`
        : it.type === 'matrica' ? matricaHtml(it)
        : it.type === 'kep' ? kepHtml(it)
        : it.type === 'draw' ? `<div class="activity"><div class="prompt">${it.say}</div><div style="font-size:180px;line-height:1.2">${it.pic}</div><div class="prompt">→ ${it.done}</div></div>`
        : it.type === 'clap' ? `<div class="activity"><div class="prompt">tapsolás: ${it.word.parts.join('-')}</div><div class="items"><span class="item" style="font-size:150px">${it.word.t}</span></div><div class="prompt">${it.word.name} · ${it.word.parts.length} szótag</div></div>`
        : `<div class="activity"><div class="prompt">${it.type} ${JSON.stringify({ n: it.n, a: it.a, b: it.b, op: it.op })}</div></div>`;
      card.innerHTML = `<div class="gin">${body}</div><p>${x.id} · ${x.level}. szint${it.sound ? '<br>🔊 ' + sndText(it.sound.events) : ''}</p>`;
      if (it.type === 'pick') card.querySelectorAll('.answer').forEach(b => { if (it.options[+b.dataset.i].ok) b.classList.add('ok-mark'); });
      out.appendChild(card);
    }
  }
  // betűlap: minden betű és számjegy a vonásrenddel (zöld = első vonás, a nyílhegy a vonás vége)
  if (st === 'ceruza') {
    const h2 = document.createElement('h2'); h2.textContent = 'Betűlap: nyomtatott nagybetűk és számjegyek (vonássorrend: a pötty száma, irány: a nyílhegy)'; document.body.appendChild(h2);
    const sheet = document.createElement('div'); sheet.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px';
    for (const ch of [...LETTERS, ...DIGITS]) sheet.insertAdjacentHTML('beforeend', `<div style="text-align:center;font:700 18px system-ui">${strokesSvg(compose(ch), 130)}<br>${ch}</div>`);
    document.body.appendChild(sheet);
  }
  // képlap: minden színezős kép a kész színekkel, alatta a részek neve és szintje (a szülő is átnézheti)
  if (st === 'rajz') {
    const h2 = document.createElement('h2'); h2.textContent = 'Színezős képek (kész színekkel; a rózsaszín pötty a koppintási pont)'; document.body.appendChild(h2);
    const sheet = document.createElement('div'); sheet.style.cssText = 'display:flex;flex-wrap:wrap;gap:14px';
    for (const [pic, K] of Object.entries(KEPEK)) {
      const body = K.parts.map(p => p[6].map(s => shapeSvg(s, `fill="${p[4]}" stroke="#3b2a63" stroke-width="3" stroke-linejoin="round"`)).join('')).join('')
        + K.deco.map(decoSvg).join('') + K.parts.map(p => { const [x, y] = tapPoint(pic, p[0]); return `<circle cx="${x}" cy="${y}" r="2.5" fill="#ff2d6f"/>`; }).join('');
      sheet.insertAdjacentHTML('beforeend', `<div style="width:300px;font:600 13px system-ui;background:#f3ecff;border-radius:14px;padding:8px"><svg viewBox="0 0 200 200" style="width:284px;height:284px;background:#fff;border-radius:12px">${body}</svg><br>${K.pic} ${K.name}: ${K.parts.map(p => `${p[2]} (${p[1]})`).join(', ')}</div>`);
    }
    document.body.appendChild(sheet);
  }
  window.__ready = true;
</script>
</body>
</html>
