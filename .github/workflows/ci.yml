name: tesztek
on:
  push:
    branches: [main]
  pull_request:
jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tartalom-tesztek
        run: node --test tests/content.test.mjs tests/profiles.test.mjs tests/reward-timer.test.mjs
